server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxies the Api into this same origin — VITE_API_BASE_URL is "/api" (see
    # Dockerfile), so the browser never talks to api:8080 directly in the dockerized path. That's
    # what makes this an actual reverse proxy rather than just a static file server: one origin
    # for both, no CORS needed for this path (still configured Api-side for `npm run dev`, which
    # talks to the Api directly on a different port with no proxy in front of it).
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR needs the WebSocket upgrade headers explicitly — nginx doesn't forward Upgrade/
    # Connection by default — and a long read timeout, since nginx's default 60s idle timeout
    # would otherwise cut a live-but-quiet hub connection out from under a connected browser.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # react-router uses client-side routing (BrowserRouter) — fall back to index.html for any
    # path nginx doesn't have a static file for, so a direct load/refresh of e.g. /login works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
