server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver.
    # Docker embedded DNS is at 127.0.0.11.
    # ipv6=off avoids IPv6 lookup delay on Docker networks.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Using variables forces dynamic runtime DNS resolution so Nginx does not fail
    # on startup if upstream services (api or ui) are not running yet.
    set $api_upstream http://api:8080;
    set $ui_upstream http://ui:5173;

    # Reverse-proxies API requests to the api container
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket connections with connection upgrade & long timeout
    location /hubs/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Reverse-proxies frontend requests to the ui container (Vite preview)
    location / {
        proxy_pass $ui_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
