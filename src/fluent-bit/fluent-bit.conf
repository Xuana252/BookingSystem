[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf

# Docker's `fluentd` logging driver on api/worker connects here and forwards each
# container's stdout as a record (Docker wraps the raw log line in a "log" key).
[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# Api/Worker write structured JSON (Serilog's JsonFormatter) to stdout — parse that JSON
# out of Docker's "log" wrapper so Splunk gets real fields, not one opaque string.
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        serilog_json
    Reserve_Data  On

[OUTPUT]
    Name              splunk
    Match             *
    Host              splunk
    Port              8088
    Splunk_Token      ${SPLUNK_HEC_TOKEN}
    TLS               Off
    # Splunk_Send_Raw Off (the default) — routes through the HEC *event* endpoint
    # (/services/collector/event), which wraps each record as {"event": {...fields...}}.
    # The *raw* endpoint (Send_Raw On) is for unstructured text streams and doesn't work
    # correctly here since the parser filter above has already expanded each record into
    # real fields — sending those through the raw endpoint produced Splunk's
    # {"text":"No data","code":5} error, an effectively empty body from Splunk's side.
