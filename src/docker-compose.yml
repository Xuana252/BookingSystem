services:
  postgres:
    image: postgres:16
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: local-redis
    restart: unless-stopped
    # redis:7.2-alpine declares /data as a VOLUME internally too (same issue as Splunk's
    # /opt/splunk/var above) — without this mapping, every recreation orphaned a fresh anonymous
    # volume. Unlike Splunk there's no real data worth keeping here (this only ever holds the
    # 5-minute-TTL room-availability cache, designed to self-heal on a miss) — named purely to
    # stop the leak, not because losing it on restart would matter.
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  moto:
    image: motoserver/moto:latest
    container_name: local-moto
    restart: unless-stopped
    profiles: ["mock-aws", "full"]
    environment:
      # Restrict which services moto spins up (optional, speeds up startup)
      MOTO_SERVICE: sns,sqs,dynamodb
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 5000), 2)\""]
      interval: 5s
      timeout: 10s
      retries: 10

  moto-init:
    image: amazon/aws-cli:latest
    container_name: local-moto-init
    profiles: ["mock-aws", "full"]
    depends_on:
      moto:
        condition: service_healthy
    volumes:
      - ./moto-init:/moto-init:ro
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://moto:5000
    entrypoint: ["/bin/sh", "-c", "sh /moto-init/init-all.sh"]

  # Self-hosted log destination — no external Splunk account needed. SPLUNK_HEC_TOKEN
  # auto-provisions a matching HTTP Event Collector input at first boot.
  splunk:
    image: splunk/splunk:latest
    container_name: local-splunk
    restart: unless-stopped
    profiles: ["logging", "full"]
    environment:
      - SPLUNK_START_ARGS=--accept-license
      # Newer splunk/splunk images gate startup on this too, separate from --accept-license.
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=ChangeMe123!
      - SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000
      - SPLUNK_HEC_SSL=False
    # The splunk/splunk image declares /opt/splunk/etc and /opt/splunk/var as VOLUMEs
    # internally. Without an explicit mapping here, Docker silently creates a new anonymous
    # volume for each on every container recreation instead of reusing one — orphaned junk that
    # never gets cleaned up (this is exactly what the dozens of unnamed multi-GB volumes turned
    # out to be). Named both, even though /etc is small config SPLUNK_HEC_TOKEN et al. would
    # regenerate identically from the environment above anyway — zero anonymous-volume leakage
    # from this container beats "leaks less than before." As a side effect, both Splunk's
    # indexed logs and its config now survive a container recreation instead of starting fresh.
    volumes:
      - splunk_var:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
    ports:
      - "8000:8000" # web UI
      - "8088:8088" # HTTP Event Collector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Log-shipping sidecar (see doc/notes/phase-2/sidecar-pattern.md): api/worker only ever write
  # structured JSON to stdout and know nothing about Splunk. Docker's `fluentd` logging
  # driver on those two services forwards each line here; this container parses it and
  # ships it on to Splunk's HEC. One shared instance for both services rather than a
  # strict one-per-container sidecar — see the notes file for why that's an honest
  # simplification, not the textbook pattern.
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: local-fluent-bit
    restart: unless-stopped
    profiles: ["logging", "full"]
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
    ports:
      - "24224:24224"
    environment:
      - SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000
    depends_on:
      splunk:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Booking.Api/Dockerfile
    container_name: local-api
    restart: unless-stopped
    profiles: ["backend", "full"]
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=devdb;Username=dev;Password=dev
      # Defaults point at Moto. To switch this container to real AWS: set AWS_ENDPOINT_URL=
      # (blank) plus the other AWS_* vars below in .env (see .env.example) — no compose edit
      # needed. AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are the SDK's own recognized names,
      # picked up by its default credential provider chain; ignored entirely on the Moto path.
      - Aws__EndpointUrl=${AWS_ENDPOINT_URL-http://moto:5000}
      - Aws__Region=${AWS_REGION:-us-east-1}
      - Aws__SnsTopicArn=${AWS_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:123456789012:booking-events}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - Redis__ConnectionString=redis:6379
      # New Relic APM (CoreCLR Profiler)
      - CORECLR_ENABLE_PROFILING=${CORECLR_ENABLE_PROFILING:-1}
      - CORECLR_PROFILER={36032161-FFC0-4B61-B559-F6C5D41BAE5A}
      - CORECLR_NEWRELIC_HOME=/usr/local/newrelic-dotnet-agent
      - CORECLR_PROFILER_PATH=/usr/local/newrelic-dotnet-agent/libNewRelicProfiler.so
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME_API:-Booking.Api (Local)}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=true
      # AI Chatbot (Semantic Kernel). Set OPENAI_API_KEY in .env (see .env.example).
      - Chat__OpenAI__ApiKey=${OPENAI_API_KEY:-}
    logging:
      driver: fluentd
      options:
        # The fluentd log driver runs inside the Docker daemon, not this container's own
        # network namespace, so it can't resolve the `fluent-bit` service name — reach it
        # via the port fluent-bit publishes to the host instead.
        fluentd-address: "localhost:24224"
        tag: "booking.api"
        # Without this, the fluentd driver blocks the container from starting at all until it
        # can reach fluent-bit — meaning "logging" wasn't actually optional, api/worker were
        # forced to bring up fluent-bit (and, transitively, Splunk's ~120s health check) even
        # for a change that has nothing to do with logging. async buffers instead and retries
        # in the background, so the "logging" profile can genuinely be skipped.
        fluentd-async: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Booking.Worker/Dockerfile
    container_name: local-worker
    restart: unless-stopped
    profiles: ["backend", "full"]
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=devdb;Username=dev;Password=dev
      # See the api service's comment above — same Moto/real-AWS toggle via .env.
      - Aws__EndpointUrl=${AWS_ENDPOINT_URL-http://moto:5000}
      - Aws__Region=${AWS_REGION:-us-east-1}
      - Aws__SqsQueueUrl=${AWS_SQS_QUEUE_URL:-http://moto:5000/123456789012/booking-events-queue}
      - Aws__SnsTopicArn=${AWS_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:123456789012:booking-events}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - Redis__ConnectionString=redis:6379
      - Gmail__Username=${GMAIL_USERNAME:-}
      - Gmail__AppPassword=${GMAIL_APP_PASSWORD:-}
      # New Relic APM (CoreCLR Profiler)
      - CORECLR_ENABLE_PROFILING=${CORECLR_ENABLE_PROFILING:-1}
      - CORECLR_PROFILER={36032161-FFC0-4B61-B559-F6C5D41BAE5A}
      - CORECLR_NEWRELIC_HOME=/usr/local/newrelic-dotnet-agent
      - CORECLR_PROFILER_PATH=/usr/local/newrelic-dotnet-agent/libNewRelicProfiler.so
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME_WORKER:-Booking.Worker (Local)}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=true
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "booking.worker"
        fluentd-async: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Built static bundle served via Vite preview on internal port 5173.
  # Nginx reverse-proxies frontend requests here, and /api & /hubs to the api service.
  ui:
    build:
      context: ../ui/Booking.UI
    container_name: local-ui
    restart: unless-stopped
    profiles: ["frontend", "full"]
    expose:
      - "5173"

  # Reverse-proxy gateway routing / to ui:5173, and /api & /hubs to api:8080.
  # Uses dynamic DNS resolution (resolver 127.0.0.11) so it starts cleanly even if
  # api is not currently running.
  nginx:
    image: nginx:alpine
    container_name: local-nginx
    restart: unless-stopped
    profiles: ["frontend", "full"]
    depends_on:
      ui:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"

volumes:
  postgres_data:
  splunk_var:
  splunk_etc:
  redis_data: