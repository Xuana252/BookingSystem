services:
  postgres:
    image: postgres:16
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  moto:
    image: motoserver/moto:latest
    container_name: local-moto
    restart: unless-stopped
    environment:
      # Restrict which services moto spins up (optional, speeds up startup)
      MOTO_SERVICE: sns,sqs,dynamodb
    ports:
      - "5000:5000"

volumes:
  postgres_data: