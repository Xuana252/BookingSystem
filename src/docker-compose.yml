services:
  postgres:
    image: postgres:16
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  moto:
    image: motoserver/moto:latest
    container_name: local-moto
    restart: unless-stopped
    environment:
      # Restrict which services moto spins up (optional, speeds up startup)
      MOTO_SERVICE: sns,sqs,dynamodb
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 5000), 2)\""]
      interval: 5s
      timeout: 10s
      retries: 10

  moto-init:
    image: amazon/aws-cli:latest
    container_name: local-moto-init
    depends_on:
      moto:
        condition: service_healthy
    volumes:
      - ./moto-init:/moto-init:ro
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://moto:5000
    entrypoint: ["/bin/sh", "-c", "sh /moto-init/init-all.sh"]

  # Self-hosted log destination — no external Splunk account needed. SPLUNK_HEC_TOKEN
  # auto-provisions a matching HTTP Event Collector input at first boot.
  splunk:
    image: splunk/splunk:latest
    container_name: local-splunk
    restart: unless-stopped
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=ChangeMe123!
      - SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000
      - SPLUNK_HEC_SSL=False
    ports:
      - "8000:8000" # web UI
      - "8088:8088" # HTTP Event Collector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Log-shipping sidecar (see doc/notes/sidecar-pattern.md): api/worker only ever write
  # structured JSON to stdout and know nothing about Splunk. Docker's `fluentd` logging
  # driver on those two services forwards each line here; this container parses it and
  # ships it on to Splunk's HEC. One shared instance for both services rather than a
  # strict one-per-container sidecar — see the notes file for why that's an honest
  # simplification, not the textbook pattern.
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: local-fluent-bit
    restart: unless-stopped
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
    ports:
      - "24224:24224"
    environment:
      - SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000
    depends_on:
      splunk:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Booking.Api/Dockerfile
    container_name: local-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=devdb;Username=dev;Password=dev
      - Aws__EndpointUrl=http://moto:5000
      - Aws__SnsTopicArn=arn:aws:sns:us-east-1:123456789012:booking-events
      - Redis__ConnectionString=redis:6379
    logging:
      driver: fluentd
      options:
        # The fluentd log driver runs inside the Docker daemon, not this container's own
        # network namespace, so it can't resolve the `fluent-bit` service name — reach it
        # via the port fluent-bit publishes to the host instead.
        fluentd-address: "localhost:24224"
        tag: "booking.api"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto-init:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Booking.Worker/Dockerfile
    container_name: local-worker
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=devdb;Username=dev;Password=dev
      - Aws__EndpointUrl=http://moto:5000
      - Aws__SqsQueueUrl=http://moto:5000/123456789012/booking-events-queue
      - Aws__SnsTopicArn=arn:aws:sns:us-east-1:123456789012:booking-events
      - Redis__ConnectionString=redis:6379
      - Gmail__Username=${GMAIL_USERNAME:-}
      - Gmail__AppPassword=${GMAIL_APP_PASSWORD:-}
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "booking.worker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto-init:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started

volumes:
  postgres_data: